name: CI

# The repository had no CI at all, so every guarantee in this codebase — atomic
# credit reservation, SKIP LOCKED work claiming, webhook idempotency, the review
# upsert merge rules — was asserted only by prose in file headers. This runs the
# suite that actually checks them.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest

    # The tests run against a REAL PostgreSQL on purpose. Every invariant worth
    # testing here is a property of Postgres executing a specific statement
    # (ON CONFLICT, FOR UPDATE SKIP LOCKED, partial unique indexes); a mocked
    # client would only assert that we still send the same string.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: getrankrise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 5000
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: getrankrise_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      # Test-only secrets. Real ones live in the deployment environment.
      ACCESS_TOKEN_SECRET: ci-access-secret-not-used-anywhere-real
      REFRESH_TOKEN_SECRET: ci-refresh-secret-not-used-anywhere-real
      CLIENT_URL: http://localhost:5173
      # The background loops would compete with the tests for rows.
      CAMPAIGN_RUNNER_DISABLED: "true"
      SYNC_SCHEDULER_DISABLED: "true"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Verify every module loads
        # Catches import cycles, missing exports and typos that only surface at
        # module-evaluation time — the class of failure that used to stop the
        # server booting at all.
        run: |
          node --input-type=module -e '
            const files = process.argv.slice(1);
            let failed = 0;
            for (const f of files) {
              try { await import(f); }
              catch (e) { failed++; console.error("FAIL " + f + ": " + e.message); }
            }
            console.log(`${files.length} modules checked, ${failed} failed`);
            process.exit(failed ? 1 : 0);
          ' $(find src -name '*.js' | sed 's|^|./|')

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend — lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx eslint .

      - name: Run tests
        # Store-level unit tests against the real reducers. The sign-out path
        # is the reason these exist: three separate defects there (a session
        # never revoked server-side, an auth slice never cleared, and four
        # reset actions written for logout and never dispatched) all passed
        # lint and build without complaint, because every one of them was
        # working code that simply was not reached.
        run: npm test

      - name: Build
        # VITE_API_URL is required at BUILD time — vite.config.js fails the
        # build without it rather than shipping a bundle that calls localhost.
        # The value here only has to be well-formed; the real one is set in the
        # hosting provider's build environment.
        env:
          VITE_API_URL: https://api.example.com/api/v1
        run: npm run build
